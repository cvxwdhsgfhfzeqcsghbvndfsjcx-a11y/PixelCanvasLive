<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PixelCanvas Live</title>
<style>
body{font:16px system-ui;background:#10131b;color:#f4f6ff;max-width:760px;margin:35px auto;padding:16px}
section{background:#1b2030;border-radius:16px;padding:20px;margin:14px 0}
button,input{font:inherit;padding:12px;border-radius:9px;border:0;margin:5px 0}
button{background:#73e0c1;color:#102018;font-weight:bold;cursor:pointer}
input{max-width:95%;background:#30374a;color:white}
#status{white-space:pre-wrap;line-height:1.7}
video{width:100%;max-height:300px;background:#08090d}
small{color:#b7bfd3}
</style>
</head>
<body>
<h1>PixelCanvas Live</h1>
<section>
<h2>Join the live queue</h2>
<p>Enter the private stream token supplied by the site owner.</p>
<input id="token" type="password" placeholder="Private stream token" autocomplete="off">
<br><input id="name" maxlength="40" placeholder="Device name">
<br><button id="join">Join Queue</button>
<button id="stop" disabled>Stop Streaming</button>
<div id="status">Not connected.</div>
</section>
<section>
<h2>Live source</h2>
<p>When your turn starts, choose a screen or window to share.</p>
<video id="preview" autoplay muted playsinline></video>
<p><small>Keep this browser tab open while streaming.</small></p>
</section>
<script>
const $=id=>document.getElementById(id);
let ws=null, media=null, timer=null, myId=null, activeId=null;
function say(s){$("status").textContent=s}
function stopCapture(){
 if(timer){clearInterval(timer);timer=null}
 if(media){media.getTracks().forEach(t=>t.stop());media=null}
 $("preview").srcObject=null;
}
async function beginCapture(){
 try{
  media=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false});
  $("preview").srcObject=media;
  const video=$("preview");
  await video.play();
  const canvas=document.createElement("canvas");
  canvas.width=200;canvas.height=200;
  const ctx=canvas.getContext("2d",{alpha:false});
  media.getVideoTracks()[0].addEventListener("ended",()=>stopCapture());
  timer=setInterval(()=>{
   if(!ws||ws.readyState!==WebSocket.OPEN||!activeId||activeId!==myId||video.readyState<2)return;
   ctx.drawImage(video,0,0,200,200);
   ws.send(JSON.stringify({type:"frame",data:canvas.toDataURL("image/jpeg",0.65)}));
  },200);
 }catch(e){say("Screen sharing was cancelled or unavailable: "+e.message)}
}
$("join").onclick=()=>{
 if(ws)return;
 const token=$("token").value.trim();
 if(!token){say("Enter your private token first.");return}
 const name=$("name").value.trim()||"Device";
 const proto=location.protocol==="https:"?"wss:":"ws:";
 ws=new WebSocket(proto+"//"+location.host+"/?token="+encodeURIComponent(token)+"&name="+encodeURIComponent(name));
 ws.onopen=()=>{say("Connected. Waiting for queue position…");$("join").disabled=true;$("stop").disabled=false};
 ws.onmessage=async event=>{
  const s=JSON.parse(event.data);
  if(s.type!=="state")return;
  myId=s.yourId;
  const next=s.active===myId;
  say((next?"YOU ARE LIVE":"Waiting in queue")+
   "\nActive device: "+(s.active||"none")+
   "\nDevices waiting: "+s.queue.length+
   "\nYour turn begins automatically when the current stream ends.");
  if(next&&!activeId){activeId=myId;await beginCapture()}
  if(!next&&activeId){activeId=null;stopCapture()}
 };
 ws.onerror=()=>say("Connection error. Check the deployed service.");
 ws.onclose=()=>{stopCapture();ws=null;myId=null;activeId=null;$("join").disabled=false;$("stop").disabled=true;say("Disconnected.")};
};
$("stop").onclick=()=>{stopCapture();if(ws)ws.close();};
</script>
</body>
</html>
